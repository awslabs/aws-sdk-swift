name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_SWIFT_SDK_USE_LOCAL_DEPS: 1

jobs:
  ktlint:
    if: github.repository == 'awslabs/aws-sdk-swift' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Keep the Gradle user home explicit and inside the workspace, matching the
      # other workflows that run Gradle.  This job is not containerized, but being
      # explicit keeps the cache correct if it ever moves into a container, where
      # HOME and the JVM's user.home disagree.
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          path: aws-sdk-swift
      - name: Checkout smithy-swift with composite action
        uses: ./aws-sdk-swift/.github/actions/checkout-smithy-swift-composite-action
        with:
          STAGING_PARTNER_REPO_PRIVATE_DEPLOY_KEY: ${{ secrets.STAGING_PARTNER_REPO_PRIVATE_DEPLOY_KEY }}
          STAGING_PARTNER_REPO: ${{ secrets.STAGING_PARTNER_REPO }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Lint smithy-aws-swift-codegen
        run: cd aws-sdk-swift && ./gradlew ktlint

  swiftlint:
    if: github.repository == 'awslabs/aws-sdk-swift' || github.event_name == 'pull_request'
    runs-on: macos-26
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          path: aws-sdk-swift
      - name: Checkout smithy-swift with composite action
        uses: ./aws-sdk-swift/.github/actions/checkout-smithy-swift-composite-action
        with:
          STAGING_PARTNER_REPO_PRIVATE_DEPLOY_KEY: ${{ secrets.STAGING_PARTNER_REPO_PRIVATE_DEPLOY_KEY }}
          STAGING_PARTNER_REPO: ${{ secrets.STAGING_PARTNER_REPO }}
      - name: Install Swiftlint
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install swiftlint
          which swiftlint
          swiftlint --version
      - name: Run swiftlint
        run: |
          cd aws-sdk-swift
          swiftlint --strict --reporter github-actions-logging
      - name: Eliminate AWS service clients
        run: |
          cd aws-sdk-swift
          rm -rf Sources/Services/*
          cd AWSSDKSwiftCLI
          swift run AWSSDKSwiftCLI generate-package-manifest ..
          cd ..
          echo
          cat Package.swift
      - name: Compile project with Xcode
        run: |
          cd aws-sdk-swift
          xcodebuild -scheme aws-sdk-swift-Package -destination platform=macOS > xcodebuild.log
      - name: Run swiftlint analyzer
        run: |
          cd aws-sdk-swift
          swiftlint analyze --strict --reporter github-actions-logging --compiler-log-path xcodebuild.log
