name: Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  AWS_SWIFT_SDK_USE_LOCAL_DEPS: 1
  AWS_SWIFT_SDK_USE_PRERELEASE_CRT: 1
  # Keep the Gradle user home inside the workspace so that it resolves identically
  # for Gradle and for setup-gradle's cache.  In container jobs the runner sets
  # HOME=/github/home, but the JVM derives user.home from the passwd entry (/root),
  # so the default ~/.gradle refers to two different directories.
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  apple-int:
    if: github.repository == 'awslabs/aws-sdk-swift' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # This matrix runs tests on iOS sim & Mac, on oldest & newest supported Xcodes
        runner:
          - macos-14
          - xcode-27
        xcode:
          - Xcode_16.1
          - Xcode_27.0
        destination:
          - 'platform=iOS Simulator,OS=18.1,name=iPhone 16'
          - 'platform=iOS Simulator,OS=27.0,name=iPhone 17'
          - 'platform=tvOS Simulator,OS=18.1,name=Apple TV 4K (3rd generation) (at 1080p)'
          - 'platform=tvOS Simulator,OS=27.0,name=Apple TV 4K (3rd generation) (at 1080p)'
          - 'platform=visionOS Simulator,OS=2.1,name=Apple Vision Pro'
          - 'platform=visionOS Simulator,OS=27.0,name=Apple Vision Pro'
          - 'platform=macOS'
        exclude:
          # Don't run old macOS with new Xcode
          - runner: macos-14
            xcode: Xcode_27.0
          # Don't run new macOS with old Xcode
          - runner: xcode-27
            xcode: Xcode_16.1
          # Don't run old simulators with new Xcode
          - destination: 'platform=tvOS Simulator,OS=18.1,name=Apple TV 4K (3rd generation) (at 1080p)'
            xcode: Xcode_27.0
          - destination: 'platform=iOS Simulator,OS=18.1,name=iPhone 16'
            xcode: Xcode_27.0
          - destination: 'platform=visionOS Simulator,OS=2.1,name=Apple Vision Pro'
            xcode: Xcode_27.0
          # Don't run new simulators with old Xcode
          - destination: 'platform=tvOS Simulator,OS=27.0,name=Apple TV 4K (3rd generation) (at 1080p)'
            xcode: Xcode_16.1
          - destination: 'platform=iOS Simulator,OS=27.0,name=iPhone 17'
            xcode: Xcode_16.1
          - destination: 'platform=visionOS Simulator,OS=27.0,name=Apple Vision Pro'
            xcode: Xcode_16.1
    steps:
      - name: Configure Xcode
        run: sudo xcode-select -s /Applications/${{ matrix.xcode }}.app
      - name: Configure AWS Credentials for Integration Tests
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.INTEGRATION_TEST_ROLE_ARN }}
          aws-region: us-west-2
      - name: Checkout aws-sdk-swift
        uses: actions/checkout@v6
        with:
          path: aws-sdk-swift
      - name: Checkout smithy-swift with composite action
        uses: ./aws-sdk-swift/.github/actions/checkout-smithy-swift-composite-action
        with:
          STAGING_PARTNER_REPO_PRIVATE_DEPLOY_KEY: ${{ secrets.STAGING_PARTNER_REPO_PRIVATE_DEPLOY_KEY }}
          STAGING_PARTNER_REPO: ${{ secrets.STAGING_PARTNER_REPO }}
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Tools Versions
        run: ./aws-sdk-swift/scripts/ci_steps/log_tool_versions.sh
      - name: List all sims installed
        run: xcrun simctl list
      - name: Add Credentials to Test Plan
        run: |
          cd aws-sdk-swift
          # JSON-escape the credentials.  They are also surrounded with double quotes.
          AKID_ESCAPED=`echo -n "$AWS_ACCESS_KEY_ID" | jq -Rsa .`
          SECRET_ESCAPED=`echo -n "$AWS_SECRET_ACCESS_KEY" | jq -Rsa .`
          REGION_ESCAPED=`echo -n "$AWS_DEFAULT_REGION" | jq -Rsa .`
          TOKEN_ESCAPED=`echo -n "$AWS_SESSION_TOKEN" | jq -Rsa .`
          # Insert the credentials into the .xctestplan file, write the modified JSON
          # to a temp file, then move the temp over the original.
          jq ".defaultOptions.environmentVariableEntries += [{\"key\": \"AWS_ACCESS_KEY_ID\", \"value\": $AKID_ESCAPED}, {\"key\": \"AWS_SECRET_ACCESS_KEY\", \"value\": $SECRET_ESCAPED}, {\"key\": \"AWS_DEFAULT_REGION\", \"value\": $REGION_ESCAPED}, {\"key\": \"AWS_SESSION_TOKEN\", \"value\": $TOKEN_ESCAPED}]" IntegrationTests/XCTestPlans/AWSIntegrationTestsOnCI.xctestplan > testplan.tmp
          mv testplan.tmp IntegrationTests/XCTestPlans/AWSIntegrationTestsOnCI.xctestplan
      - name: Prepare Integration Tests
        run: |
          cd aws-sdk-swift
          ./scripts/ci_steps/prepare_integration_tests.sh
      - name: Run Integration Tests
        run: |
          cd aws-sdk-swift/IntegrationTests
          set -o pipefail && \
          NSUnbufferedIO=YES xcodebuild \
            -scheme AWSIntegrationTestsOnCI \
            -testPlan AWSIntegrationTestsOnCI \
            -destination '${{ matrix.destination }}' \
            test 2>&1 \
            | xcbeautify

  apple-int-complete:
    needs: apple-int
    runs-on: ubuntu-latest
    steps:
      - name: Success
        run: echo "apple-int passed"

  linux-int:
    if: github.repository == 'awslabs/aws-sdk-swift' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        swift:
          - 6.0-jammy
          - 6.0-rhel-ubi9
          - 6.3-noble
          - 6.3-amazonlinux2023
    steps:
      - name: Configure AWS Credentials for Integration Tests
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.INTEGRATION_TEST_ROLE_ARN }}
          aws-region: us-west-2
      - name: Checkout aws-sdk-swift
        uses: actions/checkout@v6
        with:
          path: aws-sdk-swift
      - name: Checkout smithy-swift with composite action
        uses: ./aws-sdk-swift/.github/actions/checkout-smithy-swift-composite-action
        with:
          STAGING_PARTNER_REPO_PRIVATE_DEPLOY_KEY: ${{ secrets.STAGING_PARTNER_REPO_PRIVATE_DEPLOY_KEY }}
          STAGING_PARTNER_REPO: ${{ secrets.STAGING_PARTNER_REPO }}
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Install OpenSSL (all OS) and which (AL2 only)
        run: ./aws-sdk-swift/scripts/ci_steps/install_native_linux_dependencies.sh
      - name: Tools Versions
        run: ./aws-sdk-swift/scripts/ci_steps/log_tool_versions.sh
      - name: Prepare Integration Tests
        run: |
          cd aws-sdk-swift
          ./scripts/ci_steps/prepare_integration_tests.sh
      - name: Build Integration Tests
        run: |
          cd aws-sdk-swift/IntegrationTests
          swift build --build-tests
      - name: Run Integration Tests
        run: |
          cd aws-sdk-swift/IntegrationTests
          swift test

  linux-int-complete:
    needs: linux-int
    runs-on: ubuntu-latest
    steps:
      - name: Success
        run: echo "linux-int passed"

